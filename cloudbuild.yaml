# Cloud Build config for the DentC frontend.
#
# Why this file exists: VITE_* env vars are baked into the bundle at BUILD time.
# Cloud Run's "continuously deploy from repository" cannot pass --build-arg, so we
# build here and inject the backend URL as a build arg.
#
# Run:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_API_BASE_URL=https://dentc-backend-477406612596.us-central1.run.app
#
# Override _API_BASE_URL per environment. _REGION/_REPO default to the values below.

substitutions:
  _API_BASE_URL: "https://dentc-backend-477406612596.us-central1.run.app"
  # _API_BASE_URL: "http://127.0.0.1:8000"
  _REGION: "us-central1"
  _REPO: "dentc"
  _IMAGE: "dentc-frontend"
  # Help Center → Jira. `proxy` routes tickets through the backend (which holds the
  # Jira secret); the project key MUST exist on the configured Jira site. Leaving
  # these unset makes the bundle fall back to `demo` — tickets go to localStorage
  # and never reach Jira.
  _JIRA_MODE: "auto"
  _JIRA_PROJECT_KEY: "KAN"
  # Relative path — served from this same deployment's public/downloads/, so
  # it works without hardcoding a domain. Override only if the installer is
  # ever hosted somewhere else instead.
  _IMAGING_AGENT_DOWNLOAD_URL: "/downloads/Imaging-agent-Setup.exe"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_API_BASE_URL=${_API_BASE_URL}
      - --build-arg
      - VITE_APP_ENV=production
      - --build-arg
      - VITE_JIRA_MODE=${_JIRA_MODE}
      - --build-arg
      - VITE_JIRA_PROJECT_KEY=${_JIRA_PROJECT_KEY}
      - VITE_IMAGING_AGENT_DOWNLOAD_URL=${_IMAGING_AGENT_DOWNLOAD_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
