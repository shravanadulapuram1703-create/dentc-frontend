name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking: fails on errors (parse errors, undefined vars, hook misuse).
      # Migration-era debt rules are warnings and do not fail the build.
      - name: Lint
        run: npm run lint

      # Regenerate the API client from the committed openapi.json and fail if it
      # differs from what's checked in — i.e. someone edited generated code by
      # hand or forgot to run `npm run api:gen` after updating the schema.
      - name: API client drift check
        run: |
          npm run api:gen
          if ! git diff --quiet -- src/api/generated; then
            echo "::error::Generated API client is out of date with openapi.json."
            echo "Run 'npm run api:gen' (or 'npm run api:sync') and commit the result."
            git --no-pager diff --stat -- src/api/generated
            exit 1
          fi

      # tsc -b + vite build (production bundle).
      - name: Build
        run: npm run build
