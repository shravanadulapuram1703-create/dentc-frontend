name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-blocking until the flat ESLint config is fixed (it currently
      # misparses .ts files); surfaces problems without failing the pipeline.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Regenerate the API client from the committed openapi.json and fail if it
      # differs from what's checked in — i.e. someone edited generated code by
      # hand or forgot to run `npm run api:gen` after updating the schema.
      - name: API client drift check
        run: |
          npm run api:gen
          if ! git diff --quiet -- src/api/generated; then
            echo "::error::Generated API client is out of date with openapi.json."
            echo "Run 'npm run api:gen' (or 'npm run api:sync') and commit the result."
            git --no-pager diff --stat -- src/api/generated
            exit 1
          fi

      # tsc -b + vite build (production bundle).
      - name: Build
        run: npm run build
